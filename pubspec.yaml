name: ratix
description: "Ratix: Filmlerini, dizilerini, kitaplarını ve oyunlarını takip et, puanla ve sosyal ağında arkadaşlarınla paylaş!"
publish_to: 'none'

version: 4.3.1+25

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Supabase ---
  supabase_flutter: ^2.4.1

  image_picker: ^1.1.2

  # --- API & Ağ ---
  http: ^1.2.0
  cached_network_image: ^3.4.1

  # --- UI ve Araçlar ---
  provider: ^6.1.2
  google_fonts: ^8.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  permission_handler: ^11.3.1
  image_cropper: ^10.0.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.2
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^19.5.0
  table_calendar: ^3.1.2
  crypto: ^3.0.7
  upgrader: ^13.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Geliştirici Araçları
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/

# İkon Ayarları (En altta ve en solda olmalı)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21